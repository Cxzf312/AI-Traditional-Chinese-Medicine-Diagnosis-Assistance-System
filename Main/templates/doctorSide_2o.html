<div class="container">
    <div class="header">
        <h1>歷史辨識結果</h1>
        <p style="text-align: center;">辨識照片非100%準確，請醫師依照自己的意見做診斷!!</p>
    </div>
    <div class="data-table-container">
        <h2>待協助案例</h2>
        <table class="data-table" id="pendingTable">
            <thead>
                <tr>
                    <th>辨識到的照片</th>
                    <!-- <th>舌象</th>
                    <th>建議或改善</th>
                    <th>填寫時間</th> -->

                    <!-- <th>舌象</th> -->
                    <!-- <th>建議或改善</th> -->
                    <!-- <th>填寫時間</th> -->
                    <th>操作</th>

                </tr>
            </thead>
            <tbody id="pendingTableBody">
                {% for img_path in tongue_images.tongue_yolo_img %} <!-- 改 tongue_original_img OR tongue_yolo_img -->
                    <tr>
                        <td><img src="{{ img_path }}" alt="Detected Tongue Image" style="width: 100px; height: auto;"></td>
                        <td><button type="button" onclick="openForm('{{ img_path }}', this)">進行診斷</button></td>
                        <td id="emptyCell1"></td>
                        <td id="emptyCell2"></td>
                        <td id="emptyCell3"></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <h2>已協助案例</h2>
        <table class="data-table" id="completedTable">
            <thead>
                <tr>
                    <th>辨識到的照片</th>
                    <th>舌象</th>
                    <th>建議或改善</th>
                    <th>填寫時間</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="completedTableBody">
                <!-- 已完成的資料將會顯示在這裡 -->
            </tbody>
        </table>
    </div>
</div>
<div class="form-popup" id="formPopup">
    <form id="selectionForm">
        <h2>辨識報告</h2>
        <div class="form-group">
            <img id="detectedImage" src="" alt="Detected Tongue Image" style="width: 100%; height: auto;">
            <input type="hidden" id="hospitalName" name="hospitalName">
            <input type="hidden" id="doctorName" name="doctorName">
            <input type="hidden" id="imgPath" name="imgPath">
            <input type="hidden" id="rowIndex" name="rowIndex">
        </div>
        <div class="form-group">
            <label for="tongueType">舌象</label>
            <select id="tongueType" name="tongueType" required>
                <option value="健康舌象">健康舌象</option>
                <option value="陽虛舌象">陽虛舌象</option>
                <option value="氣虛舌象">氣虛舌象</option>
                <option value="陰虛舌象">陰虛舌象</option>
                <option value="濕熱舌象">濕熱舌象</option>
                <option value="其他">其他</option> <!-- 補充舌象 -->
            </select>
        </div>
        <div class="form-group">
            <label for="suggestions">建議或改善</label>
            <textarea id="suggestions" name="suggestions" rows="4" ></textarea>
        </div>
        <div class="btn-container">
            <button type="submit">提交</button>
            <button type="button" class="close-btn" onclick="closeForm()">取消</button>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const json_path_docSide = "./static/dist/json/doctorSide_list.json";

        // 使用 fetch API 讀取 JSON 檔案
        fetch(json_path_docSide)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                populateCompletedTable(data);
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });

        // 將讀取到的數據插入到已協助案例表格中
        function populateCompletedTable(data) {
            const completedTableBody = document.getElementById("completedTableBody");

            data.forEach(caseData => {
                const row = document.createElement("tr");

                // 插入每個欄位的資料
                row.innerHTML = `
                    <td><img src="${caseData.imgPath}" alt="Detected Tongue Image" style="width: 100px; height: auto;"></td>
                    <td>${caseData.tongueType}</td>
                    <td>${caseData.suggestions}</td>
                    <td>${caseData.timestamp}</td>
                    <td><button type="button" onclick="openFormForEdit(this)">編輯</button></td>
                `;

                // 添加該行到表格
                completedTableBody.appendChild(row);
            });
        }
    });
</script>



<script>
    const accounts = {
        '0000': { hospital: '台北榮總醫院', doctor: '李醫師', password: '0000' },
        '1234': { hospital: '台中榮總醫院', doctor: '王醫師', password: '1234' },
        '0001': { hospital: '仁愛中醫診所', doctor: '林醫師', password: '0001' },
        '0002': { hospital: '六節中醫診所', doctor: '楊醫師', password: '0002' },
        '0003': { hospital: '天心中醫診所', doctor: '溫醫師', password: '0003' },
        '0004': { hospital: '汀洲中醫診所', doctor: '王醫師', password: '0004' },
        '0005': { hospital: '天心中醫診所', doctor: '林醫師', password: '0005' }
        // 這裡可以添加更多帳號和對應的醫院、醫師資料
    };

    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (accounts[username] && accounts[username].password === password) {
            document.querySelector('.login-container').classList.remove('active');
            document.querySelector('.container').classList.add('active');

            // 更新表格標題為醫院名稱和醫師名稱
            const hospital = accounts[username].hospital;
            const doctor = accounts[username].doctor;

            // 保存醫院名稱和醫師名稱到localStorage
            localStorage.setItem('currentHospitalName', hospital);
            localStorage.setItem('currentDoctorName', doctor);
            localStorage.setItem('isLoggedIn', 'true'); // 保存登入狀態

            alert(`歡迎 ${hospital} ${doctor}`);
        } else {
            alert('帳號或密碼錯誤');
        }
    }

    function openForm(imgPath, buttonElement) {
        document.getElementById('detectedImage').src = imgPath;
        document.getElementById('imgPath').value = imgPath;

        document.getElementById('hospitalName').value = getCurrentHospitalName();
        document.getElementById('doctorName').value = getCurrentDoctorName();

        document.getElementById('formPopup').style.display = 'block';
        openForm.currentButton = buttonElement;
        openForm.isEditing = false;

        const row = buttonElement.closest('tr');
        const lastCell = row.lastElementChild;
        if (!lastCell.querySelector('button:nth-child(2)')) {
            const deleteButton = document.createElement('button');
            deleteButton.textContent = '刪除資料';
            deleteButton.onclick = function() { deleteData(this); };
            deleteButton.style.marginLeft = '10px';
            lastCell.appendChild(deleteButton);
        }
    }

    function openFormForEdit(buttonElement) {
        const row = buttonElement.closest('tr');
        const imgSrc = row.querySelector('img').src;
        const tongueType = row.children[1].textContent;
        const suggestions = row.children[2].textContent;

        document.getElementById('detectedImage').src = imgSrc;
        document.getElementById('imgPath').value = imgSrc;
        document.getElementById('tongueType').value = tongueType;
        document.getElementById('suggestions').value = suggestions;

        document.getElementById('formPopup').style.display = 'block';
        openForm.currentButton = buttonElement;
        openForm.isEditing = true;
    }

    function getCurrentHospitalName() {
        return localStorage.getItem('currentHospitalName') || '台北榮總醫院';
    }

    function getCurrentDoctorName() {
        return localStorage.getItem('currentDoctorName') || '李醫生';
    }

    function closeForm() {
        document.getElementById('formPopup').style.display = 'none';
    }

    // debug 提交表單 - 20240913
    document.getElementById('selectionForm').addEventListener('submit', function(event) {
        event.preventDefault();

        var formData = new FormData(this);

        // 添加時間戳
       formData.append('timestamp', new Date().toLocaleString());

        fetch('/submit-form', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('報告已提交！');
                closeForm();

                // 找到正在編輯的行
                const row = openForm.currentButton.closest('tr');

                // 將資料更新到已完成的表格
                const completedTableBody = document.getElementById('completedTableBody');
                const newRow = row.cloneNode(true);  // 複製整行 

                // bug: 待完成的填好之後已完成的輸出不了
                newRow.children[1].textContent = formData.get('tongueType'); // 更新舌象
                newRow.children[2].textContent = formData.get('suggestions'); // 更新建議或改善
                newRow.children[3].textContent = formData.get('timestamp'); // 更新填寫時間
                

                // 刪除待完成中的該行
                row.parentNode.removeChild(row);

                // 修改新行中的按鈕
                const actionCell = newRow.lastElementChild;
                actionCell.innerHTML = ''; // 清空單元格內容
                const editButton = document.createElement('button');
                editButton.textContent = '編輯報告';
                editButton.onclick = function() { openFormForEdit(this); };
                actionCell.appendChild(editButton);

                // 將新行添加到已完成表格
                completedTableBody.appendChild(newRow);

            } else {
                alert('提交失敗，請重試。');
            }
        })
        .catch(error => {
            alert('提交過程中出現錯誤，請重試。');
            console.error('提交錯誤:', error);
        });
    });
</script>
